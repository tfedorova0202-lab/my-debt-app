name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    
    - name: Create .env file
      run: |
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
      if: ${{ secrets.GEMINI_API_KEY != '' }}
    
    - name: Create .env with placeholder (if no secret provided)
      run: |
        echo "GEMINI_API_KEY=placeholder" > .env
      if: ${{ secrets.GEMINI_API_KEY == '' }}
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
    
    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Generate Release Notes
      run: |
        echo "## APK Build Complete ✅" > release_notes.md
        echo "" >> release_notes.md
        echo "**Build Details:**" >> release_notes.md
        echo "- Run: ${{ github.run_id }}" >> release_notes.md
        echo "- Commit: ${{ github.sha }}" >> release_notes.md
        echo "- Branch: ${{ github.ref_name }}" >> release_notes.md
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        tag_name: v${{ github.run_number }}
        body_path: release_notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build Status
      if: always()
      run: |
        echo "Build Status: ${{ job.status }}"
